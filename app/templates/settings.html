{% extends "base.html" %}

{% block content %}
<div class="auth-card" style="max-width: 600px; margin: 0 auto;">
    <div class="auth-header" style="text-align: left; margin-bottom: 1.5rem;">
        <h2 class="auth-title" style="font-size: 1.5rem;" data-i18n="set_title">Settings</h2>
        <p class="auth-subtitle" data-i18n="set_subtitle">Manage your preferences</p>
    </div>

    <form onsubmit="handleSettingsSave(event)">
        <div class="form-group">
            <label class="form-label">Default Reminder Days</label>
            <input type="number" id="set-days" class="form-input" value="30" min="1" max="90">
            <small style="color: var(--text-muted);">Days before expiry to trigger alerts</small>
        </div>

        <div class="form-group">
            <label class="form-label">Currency</label>
            <select id="set-currency" class="form-input">
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Update Password (Optional)</label>
            <input type="password" id="set-password" class="form-input" placeholder="Leave blank to keep current">
        </div>

        <div class="form-group" style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem;">
            <h4 style="margin-bottom: 1rem;" data-i18n="set_backup_title">Data Management</h4>
            <div style="background: var(--bg-light); padding: 1rem; border-radius: 8px;">
                <p style="margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted);"
                    data-i18n="set_backup_desc">Download a complete backup
                    of all your customers and policies to keep your data safe.</p>
                <button type="button" class="btn" style="background: var(--secondary); color: white; width: auto;"
                    onclick="downloadBackup()" data-i18n="btn_download_backup">
                    ⬇️ Download Full Backup (.json)
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Save Changes</button>
    </form>
</div>

<script>
    document.body.dataset.page = 'settings';

    // In a real app we would load current settings first
    // For MVP we might just rely on defaults or load user data
    // loadSettings(); 
</script>
{% endblock %}
