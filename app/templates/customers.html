{% extends "base.html" %}

{% block content %}
<div class="top-bar" style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
    <h2 data-i18n="cust_title">Customers</h2>
    <div style="display: flex; gap: 1rem;">
        <input type="text" id="customer-search" class="form-input" style="width: 250px;" onkeyup="filterCustomers()">
        <button class="btn btn-primary" style="width: auto;" onclick="showAddCustomerModal()"
            data-i18n="btn_new_customer">+ New Customer</button>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th data-i18n="tbl_name">Name</th>
                <th data-i18n="tbl_mobile">Mobile</th>
                <th data-i18n="tbl_email">Email</th>
                <th data-i18n="tbl_action">Actions</th>
            </tr>
        </thead>
        <tbody id="customers-list">
            <!-- Populated by JS -->
            <tr>
                <td colspan="4">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Simple Modal (Hidden by default) -->
<div id="customer-modal" class="modal hidden"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
    <div class="auth-card" style="position: relative;">
        <h3>Add New Customer</h3>
        <form onsubmit="handleAddCustomer(event)" style="margin-top: 1rem;">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" id="cust-name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mobile</label>
                <input type="text" id="cust-mobile" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="cust-email" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" id="cust-address" class="form-input">
            </div>
            <div style="display: flex; gap: 1rem;">
                <button type="button" class="btn" style="background: var(--border); color: var(--text-main);"
                    onclick="closeCustomerModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </div>
        </form>
    </div>
</div>
</div>

<!-- Password Modal -->

<script>
    document.body.dataset.page = 'customers';

    function showAddCustomerModal() {
        document.getElementById('customer-modal').classList.remove('hidden'); // Actually remove hidden class
        document.getElementById('customer-modal').style.display = 'flex';
    }

    function closeCustomerModal() {
        document.getElementById('customer-modal').style.display = 'none';
    }

    function closePasswordModal() {
        document.getElementById('password-modal').style.display = 'none';
    }
</script>
{% endblock %}
