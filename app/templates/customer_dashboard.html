{% extends "base.html" %}

{% block content %}
<div class="top-bar" style="margin-bottom: 2rem;">
    <h2>My Policies</h2>
    <div class="user-menu">
        <span style="font-weight: 500; margin-right: 1rem;" id="welcome-msg">Welcome</span>
        <button class="btn btn-primary" onclick="logout()">Logout</button>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Policy #</th>
                <th>Insurer</th>
                <th>Type</th>
                <th>Premium</th>
                <th>Expiry Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="my-policies-list">
            <tr>
                <td colspan="7">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadMyPolicies);

    async function loadMyPolicies() {
        const user = getUser();
        if (user) document.getElementById('welcome-msg').innerText = `Welcome, ${user.name}`;

        const response = await fetchWithAuth('/api/customer/policies');
        if (!response) return;

        const policies = await response.json();
        const list = document.getElementById('my-policies-list');
        list.innerHTML = '';

        if (policies.length === 0) {
            list.innerHTML = '<tr><td colspan="7" class="text-center">No policies found. Contact your agent.</td></tr>';
            return;
        }

        policies.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>${p.policy_number}</td>
            <td>${p.insurer}</td>
            <td>${p.type}</td>
            <td>${p.premium}</td>
            <td>${p.end_date}</td>
            <td>${p.status}</td>
            <td>
                <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; background: #6610f2; color: white;" onclick="window.open('/api/policies/receipt/${p.id}', '_blank')">Receipt</button>
            </td>
        `;
            list.appendChild(tr);
        });
    }
</script>
{% endblock %}
